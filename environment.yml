 name: whisperx-cuda121
 channels:
   - pytorch
   - nvidia
   - conda-forge
   - defaults
 dependencies:
   - python=3.10
   - pip
 
   # PyTorch + CUDA 12.1 (use nvidia/pytorch channels). This will install GPU-enabled PyTorch
   - pytorch>=2.3,<2.6
   - torchvision>=0.18,<2.20
   - torchaudio>=2.3,<2.6
   - pytorch-cuda=12.1.*
 
   # sensible base libs
   - openssl
   - ca-certificates
   - libffi
   - zlib
   - tbb
   - ffmpeg=6.1.*
   - av=11.*
 
